<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc"><title id="title">Touch controls in landscape</title><desc id="desc">Rotate to landscape. Drag play area to move. Tap the active move slot. Pause before changing settings. Browser emulation does not certify a physical device.</desc><rect width="960" height="580" rx="16" fill="#142f28"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="70" fill="#f2c66d" font-size="39" font-weight="700">Touch controls in landscape</text><text x="40" y="110" fill="#d2e0cf" font-size="22">PokéSurvivor Wiki · source-based diagram</text><rect x="40" y="142" width="880" height="66" rx="12" fill="#213f34"/><circle cx="78" cy="175" r="20" fill="#f2c66d"/><text x="78" y="185" text-anchor="middle" fill="#142f28" font-size="29" font-weight="700">1</text><text x="118" y="185" fill="#fffef8" font-size="30">Rotate to landscape</text><rect x="40" y="225" width="880" height="66" rx="12" fill="#213f34"/><circle cx="78" cy="258" r="20" fill="#f2c66d"/><text x="78" y="268" text-anchor="middle" fill="#142f28" font-size="29" font-weight="700">2</text><text x="118" y="268" fill="#fffef8" font-size="30">Drag play area to move</text><rect x="40" y="308" width="880" height="66" rx="12" fill="#213f34"/><circle cx="78" cy="341" r="20" fill="#f2c66d"/><text x="78" y="351" text-anchor="middle" fill="#142f28" font-size="29" font-weight="700">3</text><text x="118" y="351" fill="#fffef8" font-size="30">Tap the active move slot</text><rect x="40" y="391" width="880" height="66" rx="12" fill="#213f34"/><circle cx="78" cy="424" r="20" fill="#f2c66d"/><text x="78" y="434" text-anchor="middle" fill="#142f28" font-size="29" font-weight="700">4</text><text x="118" y="434" fill="#fffef8" font-size="30">Pause before changing settings</text><text x="40" y="536" fill="#d2e0cf" font-size="23">Browser emulation does not certify a physical device.</text></g></svg>