<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
  <title id="title">PokéSurvivor save safety decision flow</title><desc id="desc">Preserve a surviving browser copy, use the same linked Gmail when applicable, and treat guest recovery as uncertain.</desc>
  <rect width="960" height="580" rx="28" fill="#f5f5ed"/><path d="M0 0h960v138H0z" fill="#10261f"/><g font-family="Arial,Helvetica,sans-serif"><text x="56" y="58" fill="#f2c66d" font-size="18" font-weight="700" letter-spacing="2">SAVE SAFETY ROUTE</text><text x="56" y="101" fill="#fffef8" font-size="31" font-weight="700">Preserve first. Diagnose second.</text>
  <rect x="55" y="175" width="260" height="112" rx="16" fill="#fffef8" stroke="#cfd9ca" stroke-width="2"/><text x="82" y="214" fill="#203b33" font-size="18" font-weight="700">Does any copy still work?</text><text x="82" y="244" fill="#53685c" font-size="14">Browser, profile, device or PWA</text><text x="82" y="266" fill="#53685c" font-size="14">still shows the correct progress.</text>
  <path d="M315 230h90" stroke="#78907b" stroke-width="4"/><text x="340" y="216" fill="#305d28" font-size="13" font-weight="700">YES</text><path d="M397 220l10 10-10 10" fill="none" stroke="#78907b" stroke-width="4"/>
  <rect x="407" y="175" width="230" height="112" rx="16" fill="#e4eddd" stroke="#769076" stroke-width="2"/><text x="434" y="214" fill="#203b33" font-size="18" font-weight="700">Freeze that copy</text><text x="434" y="244" fill="#53685c" font-size="14">Do not clear data, uninstall</text><text x="434" y="266" fill="#53685c" font-size="14">or test destructive fixes.</text>
  <path d="M185 287v74" stroke="#78907b" stroke-width="4"/><text x="198" y="332" fill="#a73727" font-size="13" font-weight="700">NO / UNKNOWN</text><path d="m175 352 10 10 10-10" fill="none" stroke="#78907b" stroke-width="4"/>
  <rect x="55" y="363" width="260" height="120" rx="16" fill="#fffef8" stroke="#cfd9ca" stroke-width="2"/><text x="82" y="402" fill="#203b33" font-size="18" font-weight="700">Was Gmail linked?</text><text x="82" y="432" fill="#53685c" font-size="14">Use the same Gmail only on</text><text x="82" y="454" fill="#53685c" font-size="14">the official game domain.</text>
  <path d="M315 423h90" stroke="#78907b" stroke-width="4"/><path d="m397 413 10 10-10 10" fill="none" stroke="#78907b" stroke-width="4"/>
  <rect x="407" y="363" width="230" height="120" rx="16" fill="#fff0c9" stroke="#d6a94e" stroke-width="2"/><text x="434" y="402" fill="#203b33" font-size="18" font-weight="700">Recovery may be unknown</text><text x="434" y="432" fill="#53685c" font-size="14">Unlinked guest or unclear state:</text><text x="434" y="454" fill="#53685c" font-size="14">preserve evidence and ask support.</text>
  <rect x="688" y="175" width="217" height="308" rx="18" fill="#142f28"/><text x="717" y="217" fill="#f2c66d" font-size="17" font-weight="700">SAFE REPORT</text><text x="717" y="255" fill="#fffef8" font-size="14">✓ exact error text</text><text x="717" y="285" fill="#fffef8" font-size="14">✓ time and browser</text><text x="717" y="315" fill="#fffef8" font-size="14">✓ device and domain</text><text x="717" y="345" fill="#fffef8" font-size="14">✓ linked / guest / unknown</text><path d="M717 370h158" stroke="#49614a"/><text x="717" y="403" fill="#f2c6b8" font-size="14">× password or token</text><text x="717" y="433" fill="#f2c6b8" font-size="14">× email or room code</text><text x="717" y="463" fill="#f2c6b8" font-size="14">× save-file upload</text>
  <text x="55" y="535" fill="#53685c" font-size="14">This independent checklist cannot access the developer’s account database or guarantee restoration.</text></g>
</svg>
