<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc"><title id="title">Eight new attack behaviors</title><desc id="desc">Homing / bounce: guided or chained shots. Charge / spin: timed beam or radial hits. Quake / vortex: traveling wave or pull field. Shove / stun: displacement or control zone. Behavior is not the same as physical or special category.</desc><rect width="960" height="580" rx="16" fill="#142f28"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="70" fill="#f2c66d" font-size="39" font-weight="700">Eight new attack behaviors</text><text x="40" y="110" fill="#d2e0cf" font-size="22">PokéSurvivor Wiki · source-based diagram</text><rect x="40" y="142" width="880" height="66" rx="12" fill="#213f34"/><circle cx="78" cy="175" r="20" fill="#f2c66d"/><text x="78" y="185" text-anchor="middle" fill="#142f28" font-size="29" font-weight="700">1</text><text x="118" y="185" fill="#fffef8" font-size="30">Homing / bounce: guided or chained shots</text><rect x="40" y="225" width="880" height="66" rx="12" fill="#213f34"/><circle cx="78" cy="258" r="20" fill="#f2c66d"/><text x="78" y="268" text-anchor="middle" fill="#142f28" font-size="29" font-weight="700">2</text><text x="118" y="268" fill="#fffef8" font-size="30">Charge / spin: timed beam or radial hits</text><rect x="40" y="308" width="880" height="66" rx="12" fill="#213f34"/><circle cx="78" cy="341" r="20" fill="#f2c66d"/><text x="78" y="351" text-anchor="middle" fill="#142f28" font-size="29" font-weight="700">3</text><text x="118" y="351" fill="#fffef8" font-size="30">Quake / vortex: traveling wave or pull field</text><rect x="40" y="391" width="880" height="66" rx="12" fill="#213f34"/><circle cx="78" cy="424" r="20" fill="#f2c66d"/><text x="78" y="434" text-anchor="middle" fill="#142f28" font-size="29" font-weight="700">4</text><text x="118" y="434" fill="#fffef8" font-size="30">Shove / stun: displacement or control zone</text><text x="40" y="536" fill="#d2e0cf" font-size="23">Behavior is not the same as physical or special category.</text></g></svg>