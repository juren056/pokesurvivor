<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
  <title id="title">PokéSurvivor co-op connection check</title><desc id="desc">A four-step path from official domain and sign-in checks to a fresh room and privacy-safe report.</desc>
  <rect width="960" height="580" rx="28" fill="#10261f"/><path d="M0 460 240 350l170 85 190-160 360 165v140H0Z" fill="#1c3b30"/>
  <g font-family="Arial,Helvetica,sans-serif"><text x="60" y="76" fill="#f2c66d" font-size="18" font-weight="700" letter-spacing="2">CO-OP CONNECTION CHECK</text><text x="60" y="116" fill="#fffef8" font-size="30" font-weight="700">One clean retry, then record what happened.</text>
  <g transform="translate(60 170)"><rect width="190" height="220" rx="18" fill="#f5f5ed"/><circle cx="42" cy="42" r="22" fill="#f2c66d"/><text x="35" y="50" fill="#10261f" font-size="22" font-weight="700">1</text><text x="24" y="92" fill="#203b33" font-size="18" font-weight="700">Same official site</text><text x="24" y="126" fill="#53685c" font-size="14">Both players use</text><text x="24" y="148" fill="#53685c" font-size="14">pokesurvivor.com</text><text x="24" y="182" fill="#53685c" font-size="14">and current build.</text></g>
  <g transform="translate(277 170)"><rect width="190" height="220" rx="18" fill="#f5f5ed"/><circle cx="42" cy="42" r="22" fill="#f2c66d"/><text x="35" y="50" fill="#10261f" font-size="22" font-weight="700">2</text><text x="24" y="92" fill="#203b33" font-size="18" font-weight="700">Session &amp; clock</text><text x="24" y="126" fill="#53685c" font-size="14">Both signed in;</text><text x="24" y="148" fill="#53685c" font-size="14">automatic date and</text><text x="24" y="170" fill="#53685c" font-size="14">time enabled.</text></g>
  <g transform="translate(494 170)"><rect width="190" height="220" rx="18" fill="#f5f5ed"/><circle cx="42" cy="42" r="22" fill="#f2c66d"/><text x="35" y="50" fill="#10261f" font-size="22" font-weight="700">3</text><text x="24" y="92" fill="#203b33" font-size="18" font-weight="700">Fresh room</text><text x="24" y="126" fill="#53685c" font-size="14">Reload both pages.</text><text x="24" y="148" fill="#53685c" font-size="14">Create one new room</text><text x="24" y="170" fill="#53685c" font-size="14">and one new invite.</text></g>
  <g transform="translate(711 170)"><rect width="190" height="220" rx="18" fill="#f5f5ed"/><circle cx="42" cy="42" r="22" fill="#f2c66d"/><text x="35" y="50" fill="#10261f" font-size="22" font-weight="700">4</text><text x="24" y="92" fill="#203b33" font-size="18" font-weight="700">Report safely</text><text x="24" y="126" fill="#53685c" font-size="14">Time, browser, roles,</text><text x="24" y="148" fill="#53685c" font-size="14">version and message.</text><text x="24" y="182" fill="#a73727" font-size="14" font-weight="700">No codes or tokens.</text></g>
  <path d="M250 280h27m190 0h27m190 0h27" stroke="#f2c66d" stroke-width="5" stroke-linecap="round"/><path d="m269 270 10 10-10 10m215-20 10 10-10 10m217-20 10 10-10 10" fill="none" stroke="#f2c66d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="60" y="438" width="841" height="78" rx="14" fill="#28483d" stroke="#56705b"/><text x="88" y="471" fill="#fffef8" font-size="16" font-weight="700">A player report is evidence of a symptom, not proof of a global outage or published fix.</text><text x="88" y="495" fill="#c0d2c3" font-size="14">Preserve the exact message and distinguish it from already documented October 14 fixes.</text></g>
</svg>
