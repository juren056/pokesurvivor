<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc"><title id="title">Desktop controls</title><desc id="desc">W A S D / arrows: move. 1–4: choose active slot. Q / E: cycle active slots. Esc / P: pause solo play. The selected attack fires automatically.</desc><rect width="960" height="580" rx="16" fill="#142f28"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="70" fill="#f2c66d" font-size="39" font-weight="700">Desktop controls</text><text x="40" y="110" fill="#d2e0cf" font-size="22">PokéSurvivor Wiki · source-based diagram</text><rect x="40" y="142" width="880" height="66" rx="12" fill="#213f34"/><circle cx="78" cy="175" r="8" fill="#f2c66d"/><text x="118" y="185" fill="#fffef8" font-size="30">W A S D / arrows: move</text><rect x="40" y="225" width="880" height="66" rx="12" fill="#213f34"/><circle cx="78" cy="258" r="8" fill="#f2c66d"/><text x="118" y="268" fill="#fffef8" font-size="30">1–4: choose active slot</text><rect x="40" y="308" width="880" height="66" rx="12" fill="#213f34"/><circle cx="78" cy="341" r="8" fill="#f2c66d"/><text x="118" y="351" fill="#fffef8" font-size="30">Q / E: cycle active slots</text><rect x="40" y="391" width="880" height="66" rx="12" fill="#213f34"/><circle cx="78" cy="424" r="8" fill="#f2c66d"/><text x="118" y="434" fill="#fffef8" font-size="30">Esc / P: pause solo play</text><text x="40" y="536" fill="#d2e0cf" font-size="23">The selected attack fires automatically.</text></g></svg>